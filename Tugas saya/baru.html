<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Retro Quest 🎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #1a1a2e;
    --card-bg: #16213e;
    --accent-pink: #ff75a0;
    --accent-yellow: #fceade;
    --text-color: #ffffff;
    --pixel-border: #000000;
  }

  * {
    box-sizing: border-box;
    user-select: none;
  }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: var(--bg-color);
    background-image: 
      radial-gradient(#2a2a4a 1px, transparent 1px),
      radial-gradient(#2a2a4a 1px, var(--bg-color) 1px);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    font-family: 'Press Start 2P', monospace;
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Music Button */
  .music-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 100;
    background: var(--accent-pink);
    color: #fff;
    border: 3px solid var(--pixel-border);
    padding: 8px 12px;
    font-size: 9px;
    cursor: pointer;
    box-shadow: 3px 3px 0px var(--pixel-border);
    font-family: 'Press Start 2P', monospace;
  }
  .music-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0px var(--pixel-border);
  }

  /* Main Container */
  .game-container {
    width: 90%;
    max-width: 420px;
    background: var(--card-bg);
    border: 4px solid var(--pixel-border);
    box-shadow: 6px 6px 0px #000;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    position: relative;
    z-index: 10;
  }

  /* Pixel Heart Floating */
  .heart-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .pixel-heart {
    position: absolute;
    color: var(--accent-pink);
    font-size: 16px;
    animation: floatUp 4s linear infinite;
    opacity: 0.7;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
    50% { opacity: 0.8; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  /* Screens */
  .screen {
    display: none;
  }
  .screen.active {
    display: block;
  }

  h1 {
    font-size: 14px;
    color: var(--accent-pink);
    line-height: 1.6;
    margin-bottom: 20px;
    text-shadow: 2px 2px #000;
  }

  p.typewriter {
    font-family: 'VT323', monospace;
    font-size: 20px;
    line-height: 1.4;
    color: #fff;
    min-height: 60px;
    text-align: left;
    background: rgba(0,0,0,0.3);
    padding: 12px;
    border: 2px solid var(--pixel-border);
    border-radius: 4px;
    margin-bottom: 20px;
  }

  /* Image Polaroid Box */
  .polaroid {
    background: #fff;
    padding: 10px 10px 25px 10px;
    border: 3px solid var(--pixel-border);
    box-shadow: 4px 4px 0px #000;
    margin: 15px auto;
    width: 85%;
    transform: rotate(-2deg);
  }
  .polaroid img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border: 2px solid #000;
  }

  /* Buttons */
  .btn {
    background: var(--accent-yellow);
    color: #000;
    border: 3px solid var(--pixel-border);
    padding: 12px 18px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    box-shadow: 4px 4px 0px #000;
    margin: 8px;
    transition: transform 0.1s;
  }
  .btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0px #000;
  }

  .btn-danger {
    background: #ff4757;
    color: #fff;
  }

  /* Progress Bar */
  .progress-bar {
    width: 100%;
    height: 12px;
    background: #000;
    border: 2px solid #fff;
    margin-bottom: 15px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 20%;
    background: var(--accent-pink);
    transition: width 0.3s ease;
  }
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="toggleMusic()">🎵 MUSIC: OFF</button>
<div class="heart-bg" id="heartBg"></div>

<div class="game-container">
  
  <!-- SCREEN 1: START -->
  <div class="screen active" id="screen1">
    <h1>OUR MEMORY QUEST 👾</h1>
    <div class="polaroid">
      <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&auto=format&fit=crop&q=80" alt="Start">
    </div>
    <p class="typewriter" id="text1"></p>
    <button class="btn" onclick="nextScreen(2)">START GAME ▶</button>
  </div>

  <!-- SCREEN 2: MEMORY 1 -->
  <div class="screen" id="screen2">
    <div class="progress-bar"><div class="progress-fill" style="width: 40%;"></div></div>
    <h1>STAGE 1: KETEMUAN</h1>
    <div class="polaroid" style="transform: rotate(2deg);">
      <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=400&auto=format&fit=crop&q=80" alt="Memory 1">
    </div>
    <p class="typewriter" id="text2"></p>
    <button class="btn" onclick="nextScreen(3)">NEXT STAGE ▶</button>
  </div>

  <!-- SCREEN 3: MEMORY 2 -->
  <div class="screen" id="screen3">
    <div class="progress-bar"><div class="progress-fill" style="width: 70%;"></div></div>
    <h1>STAGE 2: NONGKRONG</h1>
    <div class="polaroid" style="transform: rotate(-3deg);">
      <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=400&auto=format&fit=crop&q=80" alt="Memory 2">
    </div>
    <p class="typewriter" id="text3"></p>
    <button class="btn" onclick="nextScreen(4)">NEXT STAGE ▶</button>
  </div>

  <!-- SCREEN 4: QUESTION -->
  <div class="screen" id="screen4">
    <div class="progress-bar"><div class="progress-fill" style="width: 90%;"></div></div>
    <h1>FINAL QUEST ❓</h1>
    <p class="typewriter" id="text4"></p>
    <div style="margin-top: 20px; position: relative; min-height: 80px;">
      <button class="btn" onclick="nextScreen(5)">YES! 💖</button>
      <button class="btn btn-danger" id="noBtn" onmouseover="dodgeNo()" onclick="dodgeNo()">NO 😜</button>
    </div>
  </div>

  <!-- SCREEN 5: FINAL LETTER -->
  <div class="screen" id="screen5">
    <div class="progress-bar"><div class="progress-fill" style="width: 100%;"></div></div>
    <h1>QUEST COMPLETED! 🎉</h1>
    <div class="polaroid">
      <img src="https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=400&auto=format&fit=crop&q=80" alt="Final">
    </div>
    <p class="typewriter" id="text5"></p>
    <button class="btn" onclick="restartGame()">REPLAY 🔄</button>
  </div>

</div>

<script>
  // Teks tiap slide (Bisa kamu ganti sesuka hati)
  const dialogs = {
    1: "Selamat datang di game petualangan kenangan kita! Siap buat mulai?",
    2: "Ingat gak waktu pertama kali kita ketemu? Masih salah tingkah dan malu-malu...",
    3: "Terus kita mulai sering jalan bareng, ngobrol jam-jaman tanpa merasa bosan.",
    4: "Pertanyaan penting: Mau terus bikin kenangan manis bareng aku selamanya?",
    5: "Yay! Makasih ya udah selalu ada. You are my favorite player 2! I love you! ❤️"
  };

  let musicPlaying = false;
  const audio = document.getElementById('bgMusic');
  const musicBtn = document.querySelector('.music-btn');

  function toggleMusic() {
    if (musicPlaying) {
      audio.pause();
      musicBtn.innerText = "🎵 MUSIC: OFF";
      musicPlaying = false;
    } else {
      audio.play();
      musicBtn.innerText = "🎶 MUSIC: ON";
      musicPlaying = true;
    }
  }

  // Effect Ngetik (Typewriter)
  function typeWriter(text, elementId, speed = 40) {
    let i = 0;
    const elem = document.getElementById(elementId);
    elem.innerText = '';
    function type() {
      if (i < text.length) {
        elem.innerText += text.charAt(i);
        i++;
        setTimeout(type, speed);
      }
    }
    type();
  }

  // Pindah Screen
  function nextScreen(screenNum) {
    if (!musicPlaying && screenNum === 2) {
      toggleMusic(); // Otomatis putar lagu saat game mulai
    }
    
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen' + screenNum).classList.add('active');
    
    typeWriter(dialogs[screenNum], 'text' + screenNum);
  }

  function restartGame() {
    nextScreen(1);
  }

  // Tombol "NO" kabur saat di-hover/klik
  function dodgeNo() {
    const btn = document.getElementById('noBtn');
    const x = Math.random() * 140 - 70;
    const y = Math.random() * 100 - 50;
    btn.style.transform = `translate(${x}px, ${y}px)`;
  }

  // Floating Hearts
  function createHearts() {
    const container = document.getElementById('heartBg');
    for(let i=0; i<15; i++) {
      let heart = document.createElement('div');
      heart.className = 'pixel-heart';
      heart.innerText = '♥';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (3 + Math.random() * 3) + 's';
      heart.style.animationDelay = Math.random() * 2 + 's';
      container.appendChild(heart);
    }
  }

  window.onload = () => {
    createHearts();
    typeWriter(dialogs[1], 'text1');
  };
</script>
</body>
</html>
