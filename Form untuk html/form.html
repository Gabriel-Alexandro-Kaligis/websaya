<!DOCTYPE html>
<html>
    <head>
        <title>Learning HTML Forms</title>
    </head>
    <body>
        <form action="server.php" method="GET">
            <fieldset>
                <legend>Personal Information</legend>
            <label for="name">First Name:</label>
            <input type="text" id ="fname" name="fname" required><br>
            <label for="lname">Last Name:</label>
            <input type="text" id ="lname" name="lname"><br>


            <label>Gender:</label>
            <input type="radio" id="gender" name="gender" value="male">
            <label for="gender">Male</label>
            <input type="radio" id="gender" name="gender" value="female">
            <label for="gender">Female</label><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br>
            </fieldset>


            <fieldset>
                <legend>Additional Information</legend>
                    <label for="hobby1">Hobbies:</label><br>
                    <input type="checkbox" id="hobby1" name="hobby1" value="Listening to music">
                    <label for="hobby1">Listen to Music</label>
                    <input type="checkbox" id="hobby2" name="hobby2" value="Playing games">
                    <label for="hobby2">Playing games</label>
                    <input type="checkbox" id="hobby3" name="hobby3" value="Watching Movies">
                    <label for="hobby3">Watching Movies</label>
                    <input type="checkbox" id="hobby4" name="hobby4" value="Reading Books">
                    <label for="hobby4">Reading Books</label><br>

                    <label for="address">Address:</label>
                    <textarea id="address" name="address" rows="5" cols="30" required></textarea><br>


                    <label for="major">Major:</label>
                    <select id="major" name="major" required>
                        <option selected value="">Belum di Pilih</option>
                        <option value="TI">Teknik Informatika</option>
                        <option value="SI">Sistem Informasi</option>
                        <option value="GD">Graphic Design</option>
                    </select>
            </fieldset>

            <br><br>
            <input type="submit" value="Submit">


        </form>
    </body>

</html>
