<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label for="hours">Study hours:</label>
    <input type="number" id="hours">
    <button id="checkButton">Check Goal</button>
    <p id="result"></p>

    <script>
        const button = document.querySelector("#helloButton");
        const checkButton = document.querySelector("#checkButton");
        const result = document.querySelector("#result");

        checkButton.addEventListener("click", () => {
            const input = Number(document.querySelector("#hours").value);

            if(input === "" || isNaN(input) || input < 0)
            {
                result.textContent = "Enter valid hours.";
            } else if (input >= 2) {
                result.textContent = "Goal reached";
            } else {
                result.textContent = "Keep studying";
            }
        });
    </script>
</body>
</html>
